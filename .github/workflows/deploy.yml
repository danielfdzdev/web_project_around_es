name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p dist
          cp -R src/. dist/
          for dir in blocks components scripts pages images vendor; do
            if [ -d "$dir" ]; then
              cp -R "$dir" dist/
            fi
          done

          # Fix asset paths in the deployed HTML only
          sed -i 's|="\.\./|="./|g' dist/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
