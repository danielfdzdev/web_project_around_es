<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Around The World</title>
    <link href="../pages/index.css" rel="stylesheet" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          alt="Logotipo Around The U.S."
          class="logo header__logo"
          src="../images/logo.svg"
        />
      </header>
      <div class="spinner spinner_visible"><i></i></div>
      <div class="load-error">
        <h2 class="load-error__title">No pudimos cargar la página</h2>
        <p class="load-error__message">
          Tu perfil y tus lugares no están disponibles en este momento
        </p>
      </div>
      <main class="content content_hidden">
        <section class="profile page__section">
          <div class="profile__pic-container">
            <button
              class="profile__image-button"
              type="button"
              aria-label="Edit profile picture"
            >
              <img class="profile__image" src=" " alt="Avatar" />
              <span class="profile__image-overlay"></span>
            </button>
          </div>

          <div class="profile__info">
            <h1 class="profile__title"></h1>
            <button
              aria-label="Editar perfil"
              class="profile__edit-button"
              type="button"
            ></button>
            <p class="profile__description"></p>
          </div>
          <button
            aria-label="Agregar tarjeta"
            class="profile__add-button"
            type="button"
          ></button>
        </section>

        <section class="cards page__section">
          <ul class="cards__list"></ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">© 2026 Around The World</p>
      </footer>

      <div class="popup" id="profile-pic-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Cambiar foto de perfil</h3>
          <form class="popup__form" id="edit-profile-pic-form" novalidate>
            <input
              class="popup__input popup__input_type_profile-pic"
              name="avatar"
              id="profile-pic-link"
              placeholder="new pic link"
              type="url"
              required
            />
            <span
              class="profile-pic-link-input-error popup__input-error"
            ></span>

            <button
              class="button popup__button popup__button-submit"
              type="submit"
              disabled
            >
              Guardar
            </button>
          </form>
        </div>
      </div>

      <div class="popup" id="edit-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Editar perfil</h3>
          <form class="popup__form" id="edit-profile-form" novalidate>
            <input
              class="popup__input popup__input_type_name"
              name="name"
              id="name"
              placeholder="Nombre"
              type="text"
              minlength="2"
              maxlength="40"
              required
            />
            <span class="name-input-error popup__input-error"></span>
            <input
              class="popup__input popup__input_type_description"
              name="description"
              id="description"
              placeholder="Acerca de mí"
              minlength="2"
              maxlength="200"
              type="text"
              required
            />
            <span class="description-input-error popup__input-error"></span>
            <button
              class="button popup__button popup__button-submit"
              type="submit"
              disabled
            >
              Guardar
            </button>
          </form>
        </div>
      </div>

      <div class="popup" id="new-card-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
            novalidate
          ></button>
          <h3 class="popup__title">Nuevo lugar</h3>
          <form class="popup__form" id="new-card-form">
            <input
              class="popup__input popup__input_type_card-name"
              name="place-name"
              id="place-name"
              placeholder="Título"
              minlength="2"
              maxlength="30"
              required
              type="text"
            />
            <span class="place-name-input-error popup__input-error"></span>

            <input
              class="popup__input popup__input_type_url"
              name="link"
              id="link"
              placeholder="Enlace a la imagen"
              required
              type="url"
            />
            <span class="link-input-error popup__input-error"></span>

            <button
              class="button popup__button popup__button-submit"
              type="submit"
              disabled
            >
              Crear
            </button>
          </form>
        </div>
      </div>

      <div class="popup" id="remove-card-popup">
        <div class="popup__content popup__delete-card">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
            novalidate
          ></button>
          <h3 class="popup__title">Estás seguro?</h3>

          <button
            class="button popup__button popup__button-submit popup__button-delete"
          >
            Sí
          </button>
        </div>
      </div>

      <div class="popup" id="image-popup">
        <div class="popup__content popup__content_content_image">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <img alt="" class="popup__image" src="#" />
          <p class="popup__caption"></p>
        </div>
      </div>
    </div>

    <div
      class="notification notification_type_error"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <span class="notification__icon" aria-hidden="true">!</span>

      <div class="notification__content">
        <p class="notification__title">Algo salió mal</p>
        <p class="notification__message"></p>
      </div>

      <button
        class="notification__close"
        type="button"
        aria-label="Cerrar notificación"
      ></button>
    </div>

    <template id="card-template">
      <li class="card">
        <img class="card__image" src="" alt="" />
        <button
          aria-label="Eliminar tarjeta"
          class="card__delete-button"
          type="button"
        ></button>
        <div class="card__description">
          <h2 class="card__title"></h2>
          <button
            aria-label="Botón Me gusta"
            class="card__like-button"
            type="button"
          ></button>
        </div>
      </li>
    </template>
    <script type="module" src="../scripts/index.js"></script>
  </body>
</html>
